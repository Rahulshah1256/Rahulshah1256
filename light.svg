    <text x="60" y="167" fill="#14213b" font-size="64" font-weight="700" letter-spacing="-2">Rahul Kumar</text>
    <text x="64" y="213" fill="#475569" font-size="22">AI agents. Reliable systems. Thoughtful products.</text>
    <path d="M64 264H712" stroke="#dbe2ef"/>
    <text x="64" y="301" fill="#59677e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1">JAVA / SPRING BOOT / GOOGLE ADK / REACT</text>
