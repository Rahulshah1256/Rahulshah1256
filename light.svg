<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rahul Kumar - Software Engineer / AI Builder</title>
  <desc id="desc">AI agents. Reliable systems. Thoughtful products. Java, Spring Boot, Google ADK, and React. A connected neural constellation with intersecting orbits decorates the right side of an off-white banner.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbff"/>
      <stop offset="1" stop-color="#f2f5fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity=".25"/>
      <stop offset=".65" stop-color="#a5f3fc" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f2f5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".04"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#surface)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#dbe2ef"/>
  <ellipse cx="978" cy="180" rx="220" ry="178" fill="url(#halo)"/>

